name: Python quality checks

on:
  push:
    branches:
      - feature/v7-7-experience-overhaul
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-syntax:
    name: Unit tests and syntax (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q console_capture.py core.py discovery.py word_export.py ui_theme.py capture_catalog.py app_config.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
