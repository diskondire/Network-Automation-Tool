name: Publish v0.7.8 SSH alpha

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-verify:
    if: >-
      ${{ github.event.head_commit.message == 'release: publish v0.7.8.0 SSH alpha' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q console_capture.py core.py discovery.py word_export.py ui_theme.py capture_catalog.py app_config.py ssh_transport.py
      - name: Run all Windows unit tests
        run: python -m unittest discover -s tests -v
      - name: Publish SSH alpha source release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.7.8.0-alpha.1 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'v0.7.8 SSH alpha release already exists; no changes made.'
            exit 0
          }
          gh release create v0.7.8.0-alpha.1 `
            --target $env:GITHUB_SHA `
            --title "Console Capture v0.7.8.0 Alpha — SSH Support" `
            --notes-file docs/RELEASE_0_7_8.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
